name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` is the gate that was missing: it fails on an unsatisfiable
      # manifest, which is exactly how the Vue 2/3 mismatch went unnoticed.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
